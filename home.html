        }

        .topnav {
            overflow: hidden;
            background-color: black;
        }

        .topnav a {
            float: left;
            color: #1affa3;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .topnav a.active {
            background-color: #ffe066;
            color: black;
        }
        .footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: black;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="aboutus.html">About_Us</a>
        <a href="gallery.html">Gallery</a>

        </div>
        <p><iframe width="560" height="315" src="https://www.youtube.com/embed/_GE6zf_hH48?si=kx9APiIL60FA6CQM"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> </p>
        <span class="border trans">Image Two Text </span>
       
        <!--Slide Show-->
        <section>
            <img class="mySlides" src="tiger.jpg" style="height:500px;">
            <img class="mySlides" src="elephant.jpg" style="height:500px;">
            <h2>Section One</h2>
            <p>Web development is the work involved in developing a
                Web site for the internet (World Wide Web) or an Intranet (a private network).
            </p>
        </section>
        <script>
            //Automatic Slideshow - change image every 3 seconds
            var myIndex = 0;
            carousel();

            function carousel() {
                var i;
                var x = document.getElementsByClassName("MySlides");
                for (i = 0; i < x.length; i++) {
                    x[i].style.display = "none";
                }
                myIndex++;
                if (myIndex > x.length) { myIndex = 1 }
                x[myIndex - 1].style.display = "block";
                setTimeout(carousel, 3000);
            }
        </script>

   </body>
