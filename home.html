<!DOCTYPE html>
<html>

<head>
    <title>Copper Corner - Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="topnav">
        <a class="active" href="home.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="contactus.html">Contact Us</a>
    </div>

    <div class="content">
        <h1>Welcome to Copper Corner!</h1>
        <p>Experience the best dining in town.</p>


        <div class="slideshow-container">
            <img class="mySlides"
                src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&h=400&fit=crop"
                alt="Dining Interior">
            <img class="mySlides"
                src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=600&h=400&fit=crop"
                alt="Delicious Food">
            <img class="mySlides" src="https://t4.ftcdn.net/jpg/02/48/81/67/360_F_248816719_1psWt0GHvxr5I84bARgZM5gmpg99u2Ml.jpg"
                alt="Delicious Food">
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 Copper Corner Restaurant.</p>
    </div>

    <script>
        // Automatic Slideshow - Change image every 3 seconds
        var myIndex = 0;
        carousel();

        function carousel() {
            var i;
            var x = document.getElementsByClassName("mySlides");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }
            myIndex++;
            if (myIndex > x.length) { myIndex = 1 }
            x[myIndex - 1].style.display = "block";
            setTimeout(carousel, 3000);
        }
    </script>

</body>

</html>
