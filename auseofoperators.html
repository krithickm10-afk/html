<!DOCTYPE html>
<html>

<body>

<h2> Operator</h2>
<p id="demo1"></p>
<p id="demo2"></p>
<p id="demo3"></p>
<p id="demo4"></p>
<script>
<!--Addition-->
//*use +, -, *, / operators*/
var x = 5;
var y = 2;
var z = x + y;
document.getElementById("demo1").innerHTML = z;

    var z1 = x - y;
    document.getElementById("demo2").innerHTML = z1;

    var z2 = x * y;
        document.getElementById("demo3").innerHTML = z2;

    var z3 = x / y;
        document.getElementById("demo4").innerHTML = z3;
</script>

</body>

</html>
