<!DOCTYPE html>
<html>

<body>

    <h2>Javascript Random Numbers (While Loop)</h2>
    <p id="number"></p>

    <script>
        var text = "";
        var count = 0; 

        while (count < 10) {
            
            var randomNumber = Math.floor(Math.random() * 101);

            text += "<br>The random number is " + randomNumber;
            count++; 
        }

        document.getElementById("number").innerHTML = text;
    </script>

</body>

</html>
